services:
  - type: web
    name: ant-ipo-watch
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - { key: GEMINI_API_KEY, sync: false }
      - { key: NTFY_TOPIC, sync: false }
      - { key: ADMIN_TOKEN, sync: false }
      - { key: PUBLIC_URL, sync: false }
